# Pipeline settings. Override locally in config/settings.local.yaml (gitignored).

paths:
  data_dir: data          # sqlite db + raw page cache (gitignored)
  wiki_dir: wiki          # generated wiki output (committed)

llm:
  provider: lmstudio             # lmstudio | openai (any OpenAI-compatible server) | ollama
  endpoint: http://localhost:1234   # LM Studio server address; "/v1" is added automatically (confirmed against a local server on :1234)
  model: "qwen3.8-27b"           # must match the id your server lists: curl <endpoint>/v1/models
  api_key_env: XW_LLM_API_KEY    # if the server needs a key: export XW_LLM_API_KEY=... in your shell (the key never goes in a file)
  reasoning_effort: "none"       # none | low | medium | high | "" (sent as `reasoning_effort`; dropped automatically if the server rejects it)
  num_ctx: 16384                 # ollama only. For LM Studio set the context length when loading the model (16k+ recommended; [Inference] fits 24 GB)
  temperature: 0.1
  timeout_s: 900
  max_retries: 2                 # extra attempts when the model returns invalid JSON
  max_output_tokens: 8192        # hard cap per reply; a model stuck in a loop fails in minutes, not after timeout_s

crawl:
  user_agent: "xterra-wiki-research/0.1"
  contact: ""             # REQUIRED for polite crawling: an email or URL site admins can reach. `xw doctor` warns if empty.
  min_delay_s: 4.0        # per-host delay between requests
  jitter_s: 2.0
  timeout_s: 30
  max_thread_pages: 15
  max_forum_pages: 5      # pages of thread listings followed per forum
  max_forum_depth: 3      # subforum depth from the seeds
  max_fetches_per_source: 150
  max_fetches_primary: 400
  respect_robots: false   # set back to true if a site asks you not to crawl it
  # A site answering these means "no automated access". The source is marked blocked and never
  # retried or worked around (no header spoofing, proxies, mirrors, or caches). Some bot walls
  # answer with 409 Conflict (or a JS proof-of-work challenge) instead of 403.
  stop_statuses: [401, 402, 403, 409]
  max_consecutive_429: 3
  min_post_chars: 60      # skip "bump" / "thanks" posts to save LLM time

extract:
  max_chunk_chars: 14000  # roughly 4k tokens of forum text per LLM call
  min_chunk_chars: 400
  max_consecutive_failures: 5   # stop extraction if the LLM keeps failing (server down, model not loaded)

scope:
  # Model years kept at extraction: both generations. Facts stating only years outside this range are dropped.
  # [Unverified] I believe the N50 ran 2005-2015 (no 2016 model year); the range stays permissive (to 2016).
  years: [2000, 2016]

# generations: one completely separate wiki section each (decided 2026-10-20: "They are nothing alike").
# Defaults are in src/xw/config.py (titles, year ranges, the words that name each generation). [Unverified]:
# the first generation's span 2000-2004 is from general knowledge, not yet from a cited source.

verify:
  require_local_pass: true      # a claim is published only if the verifier said "supported" (or "partial", see below) or a reviewer approved it
  publish_partial: true         # decided 2026-10-16: a "partial" verdict publishes the claim marked [Partial] ("needs more work"); it stays in
                                # the review/triage queues and later runs upgrade or drop it. false = fail closed (partial withholds)
  safety_min_threads: 2         # torque/capacity-style values need this many agreeing threads (from as many distinct authors), a manufacturer source, or a reviewer's approval
  publish_unverified_safety: true   # decided 2026-10-16: an unconfirmed torque/capacity/pressure value publishes marked [Unverified]/[Partial]
                                    # under a warning banner and stays queued for corroboration. false = withhold it (pending_verification.md)
  verify_model: ""              # optional second local model for the verifier pass; empty = same model
  consensus_runs: 2             # verifier passes per claim (each shuffles the claims and plants its own decoys); "supported" needs every pass to agree. 1 = single pass

review:                         # optional Claude review (opt-in; you run it, nothing is sent automatically)
  audit_rate: 0.1               # share of locally-"supported" claims sampled to measure the verifier's false-accept rate
  batch_size: 25
  excerpt_chars: 900            # only the claim plus this much source text goes into a review batch

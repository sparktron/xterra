# Pipeline settings. Override locally in config/settings.local.yaml (gitignored).

paths:
  data_dir: data          # sqlite db + raw page cache (gitignored)
  wiki_dir: wiki          # generated wiki output (committed)

llm:
  provider: lmstudio             # lmstudio | openai (any OpenAI-compatible server) | ollama
  endpoint: http://127.0.0.1:42117   # LM Studio server address; "/v1" is added automatically ([Unverified] for your setup: check `xw doctor`)
  model: "qwen3.8-27b"           # must match the id your server lists: curl <endpoint>/v1/models
  reasoning_effort: "none"       # none | low | medium | high | "" (sent as `reasoning_effort`; dropped automatically if the server rejects it)
  num_ctx: 16384                 # ollama only. For LM Studio set the context length when loading the model (16k+ recommended; [Inference] fits 24 GB)
  temperature: 0.1
  timeout_s: 900
  max_retries: 2                 # extra attempts when the model returns invalid JSON

crawl:
  user_agent: "xterra-wiki-research/0.1"
  contact: ""             # REQUIRED for polite crawling: an email or URL site admins can reach. `xw doctor` warns if empty.
  min_delay_s: 4.0        # per-host delay between requests
  jitter_s: 2.0
  timeout_s: 30
  max_thread_pages: 15
  max_forum_pages: 5      # pages of thread listings followed per forum
  max_forum_depth: 3      # subforum depth from the seeds
  max_fetches_per_source: 150
  max_fetches_primary: 400
  respect_robots: true
  # A site answering these means "no automated access". The source is marked blocked and never
  # retried or worked around (no header spoofing, proxies, mirrors, or caches).
  stop_statuses: [401, 402, 403]
  max_consecutive_429: 3
  min_post_chars: 60      # skip "bump" / "thanks" posts to save LLM time

extract:
  max_chunk_chars: 14000  # roughly 4k tokens of forum text per LLM call
  min_chunk_chars: 400
  max_consecutive_failures: 5   # stop extraction if the LLM keeps failing (server down, model not loaded)

scope:
  # [Unverified] I believe the N50 ran 2005-2015 (no 2016 model year). The range is kept permissive
  # (2005-2016) so nothing the user cares about is dropped; tighten it once verified.
  years: [2005, 2016]

verify:
  require_local_pass: true      # fail closed: a claim is published only if the verifier pass said "supported" (or a reviewer approved it)
  safety_min_threads: 2         # torque/capacity-style values need this many agreeing threads, a manufacturer source, or a reviewer's approval
  publish_unverified_safety: false
  verify_model: ""              # optional second local model for the verifier pass; empty = same model

review:                         # optional Claude review (opt-in; you run it, nothing is sent automatically)
  audit_rate: 0.1               # share of locally-"supported" claims sampled to measure the verifier's false-accept rate
  batch_size: 25
  excerpt_chars: 900            # only the claim plus this much source text goes into a review batch

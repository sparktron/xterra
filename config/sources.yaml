      - https://www.xterranation.org/index.php?forums/interior-mods-2005-2015.77/
      - https://www.xterranation.org/index.php?forums/titan-swap.93/
    howto_hints: ["how to", "how-to", "diy", "write-up", "writeup", "guide", "tutorial", "install", "swap", "replace", "replacing", "fix", "rebuild", "change", "instructions", "bypass", "upgrade", "sticky"]

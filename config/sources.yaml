# Ranked source list. The pipeline walks enabled sources in rank order.
#
# adapter: xenforo | generic. Forum discovery is implemented for XenForo only.
#   Use `thread_urls` for any site you want to read thread-by-thread with the generic adapter.
# type: forum | manufacturer | vendor | community | manual. `manufacturer` pages can raise a page to `confirmed`.
# trust: 1-5 (your judgment; used to order merging and shown in the wiki).
# generation: first-gen | second-gen. The wiki section a fact from this source goes to when the fact states no model
#   year (a stated year decides first). Give each generation's subforums their own source; a source without a
#   generation contributes only facts that state their years.
#
# Politeness is enforced in code: robots.txt, per-host delay, fetch budgets, and a hard stop on
# 401/402/403. If a site blocks bots, the pipeline records that and moves on. Use `xw ingest` for
# pages you saved yourself from your own browser session.

sources:
  - id: thenewx
    rank: 1
    generation: second-gen      # Second Generation Nissan Xterra Forums (2005+)
    name: The New X
    base_url: https://www.thenewx.org
    type: forum
    adapter: xenforo      # [Unverified] forum software not confirmed
    trust: 4
    primary: true
    enabled: true
    seeds:
      - https://www.thenewx.org/forums/electrical.12/
      - https://www.thenewx.org/forums/powertrain-driveline.11/
      - https://www.thenewx.org/forums/how-tos.15/
    howto_hints: ["how to", "how-to", "diy", "write-up", "writeup", "faq", "guide", "tutorial", "install", "swap", "replace", "fix", "sticky", "read first", "electrical", "powertrain"]
    skip_forums: ["for sale", "classified", "marketplace", "off topic", "off-topic", "introduc", "meet", "event", "vendor", "giveaway", "photos", "video"]
    notes: Primary source.

  - id: nissan-frontier-forum
    rank: 2
    generation: second-gen   # D40 Frontier, which shares the N50 Xterra's drivetrain
    name: Nissan Frontier Forum
    base_url: https://www.nissanfrontierforum.com
    type: forum
    adapter: xenforo
    trust: 3
    enabled: true         # [Unverified] URL, forum software and seed path not checked; failures are recorded and skipped
    seeds:
      - https://www.nissanfrontierforum.com/forums/

  - id: clubfrontier
    rank: 3
    generation: second-gen
    name: ClubFrontier
    base_url: https://www.clubfrontier.org
    type: forum
    adapter: generic
    trust: 3
    enabled: false        # 2026-10-20: www.clubfrontier.org answers bots with a 307 to tollbit.clubfrontier.org (pay-per-crawl), i.e. no free automated access
    thread_urls: []

  - id: xterranation
    rank: 4
    generation: second-gen
    name: XterraNation
    base_url: https://www.xterranation.org
